<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Skyjo Family Scorekeeper</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-alt: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-text: #0f172a;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #475569;
      --radius: 14px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    body.light-mode {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-alt: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --accent: #0284c7;
      --accent-text: #ffffff;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --border: #cbd5e1;
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 45px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-container {
      max-width: 620px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Header */
    header {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--accent);
    }

    .title-group p {
      margin: 2px 0 0 0;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .toolbar-row {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr auto auto;
      gap: 6px;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-toolbar-players {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.82rem;
    }

    .btn-info-highlight {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid #60a5fa;
    }

    .btn-icon {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 11px;
      font-size: 0.92rem;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .btn-secondary {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
      font-weight: 700;
    }

    /* Cards / Sections */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Game Over Banner */
    .winner-banner {
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      border: 2px solid #34d399;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      text-align: center;
      display: none;
      color: #ffffff;
    }

    .winner-banner.active {
      display: block;
    }

    .winner-banner h2 {
      margin: 0 0 4px 0;
      font-size: 1.35rem;
    }

    .winner-banner p {
      margin: 0 0 12px 0;
      font-size: 0.92rem;
      color: #d1fae5;
    }

    /* Standings Grid */
    .standings-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 8px;
    }

    .player-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .player-stat:active {
      transform: scale(0.98);
    }

    .player-stat.leader {
      border: 2px solid var(--success);
      background: rgba(34, 197, 94, 0.08);
    }

    .player-stat.over-limit {
      border: 2px solid var(--danger);
      background: rgba(239, 68, 68, 0.08);
    }

    .player-stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .player-stat-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .player-stat-name span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .edit-hint-icon {
      font-size: 0.72rem;
      opacity: 0.55;
    }

    .player-stat-score {
      font-size: 1.5rem;
      font-weight: 900;
      margin-top: 2px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: var(--card-alt);
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* Round Score Entry */
    .entry-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .entry-row:last-of-type {
      border-bottom: none;
    }

    .entry-player-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .entry-player-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .entry-player-name {
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
    }

    .entry-running-preview {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .ender-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      width: fit-content;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
    }

    .ender-chip.selected {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border-color: var(--warning);
      font-weight: 800;
    }

    .live-penalty-pill {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 2px;
      width: fit-content;
    }

    .live-penalty-pill.safe {
      background: rgba(34, 197, 94, 0.18);
      color: var(--success);
    }

    .live-penalty-pill.doubled {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .score-input-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-neg {
      background: var(--card-alt);
      color: var(--text);
      font-weight: 800;
      font-size: 1.05rem;
      width: 40px;
      height: 44px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn-calc-mini {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      width: 40px;
      height: 44px;
      padding: 0;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .score-input {
      width: 76px;
      height: 44px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      padding: 6px;
    }

    .score-input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .helper-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--warning);
    }

    /* Round History Table */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -6px;
      padding: 0 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 340px;
    }

    th, td {
      padding: 9px 5px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.78rem;
      background: var(--bg);
    }

    td.round-col {
      font-weight: 700;
      color: var(--text-muted);
      text-align: left;
      white-space: nowrap;
    }

    .badge-doubled {
      display: inline-block;
      font-size: 0.66rem;
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.45);
      padding: 1px 4px;
      border-radius: 4px;
      margin-left: 2px;
      font-weight: 800;
    }

    .badge-ender {
      display: inline-block;
      font-size: 0.66rem;
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      padding: 1px 4px;
      border-radius: 4px;
      margin-left: 2px;
    }

    .row-action-btn {
      background: transparent;
      color: var(--text-muted);
      padding: 4px 5px;
      font-size: 0.85rem;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.12rem;
    }

    /* Player Count Selector Bar */
    .count-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 12px;
    }

    .count-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 0;
      font-weight: 800;
      font-size: 0.9rem;
      border-radius: 8px;
    }

    .count-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .preset-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }

    .player-edit-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .seat-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      width: 24px;
      text-align: center;
    }

    .player-edit-input {
      flex: 1;
      height: 40px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0 10px;
      font-size: 16px;
      font-weight: 600;
    }

    .mini-order-btn {
      background: var(--card-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 9px;
      font-size: 0.8rem;
    }

    /* Tabs inside Info Modal */
    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      padding: 8px 6px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* Skyjo Visual Cards */
    .skyjo-card {
      width: 54px;
      height: 74px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 1.25rem;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      user-select: none;
    }

    .skyjo-card.mini {
      width: 38px;
      height: 52px;
      font-size: 0.95rem;
      border-radius: 7px;
    }

    .skyjo-card.clickable {
      cursor: pointer;
    }

    .skyjo-card.highlight-target {
      outline: 3px dashed #fde047;
      outline-offset: 2px;
    }

    .sc-neg { background: linear-gradient(145deg, #4f46e5, #312e81); color: #fff; }
    .sc-zero { background: linear-gradient(145deg, #06b6d4, #0e7490); color: #fff; }
    .sc-low { background: linear-gradient(145deg, #22c55e, #15803d); color: #fff; }
    .sc-mid { background: linear-gradient(145deg, #eab308, #a16207); color: #fff; }
    .sc-high { background: linear-gradient(145deg, #ef4444, #991b1b); color: #fff; }
    .sc-hidden {
      background: repeating-linear-gradient(45deg, #334155, #334155 6px, #1e293b 6px, #1e293b 12px);
      color: #94a3b8;
      border-color: #64748b;
    }
    .sc-cleared {
      background: rgba(15, 23, 42, 0.3);
      border: 2px dashed #64748b;
      color: var(--text-muted);
      font-size: 0.7rem;
      box-shadow: none;
    }

    .sandbox-top {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .pile-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .pile-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .sandbox-status {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--text);
      padding
